<svg xmlns="http://www.w3.org/2000/svg" width="680" height="590" viewBox="0 0 680 590" role="img">
<title>Diagrama de contexto del Sistema de Gestion Operativa Triverde</title>
<desc>El sistema Triverde al centro intercambia informacion con tres actores usuarios: administrador y transportista a la izquierda, operador a la derecha. El cliente es una entidad externa de negocio y SINADER un sistema externo; ambos reciben informacion por entrega manual.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.t{font-family:"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px;font-weight:500}
.s{font-family:"Segoe UI",Helvetica,Arial,sans-serif;font-size:12px;font-weight:400;fill:#5F5E5A}
</style>
</defs>

<rect x="0" y="0" width="680" height="590" fill="#FFFFFF"/>

<rect x="265" y="100" width="150" height="270" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text class="t" x="340" y="165" text-anchor="middle" dominant-baseline="central" fill="#173404">Sistema de gestión</text>
<text class="t" x="340" y="183" text-anchor="middle" dominant-baseline="central" fill="#173404">operativa Triverde</text>
<text class="s" x="340" y="220" text-anchor="middle" dominant-baseline="central" fill="#3B6D11">Plataforma web (PWA)</text>
<text class="s" x="340" y="236" text-anchor="middle" dominant-baseline="central" fill="#3B6D11">para gestionar la</text>
<text class="s" x="340" y="252" text-anchor="middle" dominant-baseline="central" fill="#3B6D11">operación de la planta</text>
<text class="s" x="340" y="268" text-anchor="middle" dominant-baseline="central" fill="#3B6D11">de material orgánico</text>

<rect x="40" y="119" width="110" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="t" x="95" y="141" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Administrador</text>
<text class="s" x="155" y="103">Configuración y</text>
<text class="s" x="155" y="116">mantenedores</text>
<line x1="155" y1="124" x2="262" y2="124" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="s" x="155" y="147">Reportes e</text>
<text class="s" x="155" y="160">indicadores</text>
<line x1="262" y1="168" x2="155" y2="168" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="309" width="110" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="t" x="95" y="331" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Transportista</text>
<text class="s" x="155" y="293">Registro de</text>
<text class="s" x="155" y="306">descarga y fotos</text>
<line x1="155" y1="314" x2="262" y2="314" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="s" x="155" y="337">Confirmación de</text>
<text class="s" x="155" y="350">recepción</text>
<line x1="262" y1="358" x2="155" y2="358" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="530" y="119" width="110" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="t" x="585" y="141" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Operador</text>
<text class="s" x="420" y="103">Registros de</text>
<text class="s" x="420" y="116">operación diaria</text>
<line x1="525" y1="124" x2="418" y2="124" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="s" x="420" y="147">Inventario,</text>
<text class="s" x="420" y="160">procesos, alertas</text>
<line x1="418" y1="168" x2="525" y2="168" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="530" y="310" width="110" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1" stroke-dasharray="5 4"/>
<text class="t" x="585" y="332" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Cliente</text>
<text class="s" x="420" y="311">Cotizaciones y</text>
<text class="s" x="420" y="324">certificados</text>
<line x1="418" y1="332" x2="525" y2="332" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow)"/>

<line x1="340" y1="373" x2="340" y2="437" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow)"/>
<text class="s" x="352" y="396">Archivo de declaración</text>
<text class="s" x="352" y="409">(carga manual)</text>

<rect x="270" y="440" width="140" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="t" x="340" y="462" text-anchor="middle" dominant-baseline="central" fill="#633806">SINADER</text>

<line x1="40" y1="518" x2="72" y2="518" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="s" x="80" y="522">Flujo de información</text>
<line x1="40" y1="544" x2="72" y2="544" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow)"/>
<text class="s" x="80" y="548">Entrega manual, fuera del sistema</text>
<rect x="300" y="505" width="14" height="14" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="s" x="322" y="516">Actor usuario</text>
<rect x="300" y="528" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#888780" stroke-width="1" stroke-dasharray="4 3"/>
<text class="s" x="322" y="539">Entidad externa de negocio</text>
<rect x="300" y="551" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="s" x="322" y="562">Sistema externo</text>
<rect x="510" y="505" width="14" height="14" rx="3" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text class="s" x="532" y="516">Sistema en foco</text>
</svg>
