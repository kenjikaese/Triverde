s vencidos</text><polygon fill="#4B7A46" points="334.5,343.5259,324.5,347.5259,334.5,351.5259,330.5,347.5259" style="stroke: #4B7A46; stroke-width: 1.0;"/><line style="stroke: #4B7A46; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="328.5" x2="514.5" y1="347.5259" y2="347.5259"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="168" x="335.5" y="341.7169">listado unificado de vigencia</text><polygon fill="#4B7A46" points="48.5,375.2319,38.5,379.2319,48.5,383.2319,44.5,379.2319" style="stroke: #4B7A46; stroke-width: 1.0;"/><line style="stroke: #4B7A46; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="42.5" x2="322.5" y1="379.2319" y2="379.2319"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="262" x="49.5" y="373.4229">muestra documentos por vencer y vencidos</text><!--MD5=[d66126974d36274f133d161f0d586f39]
@startuml cu87-controlar-vigencia-normal
skinparam backgroundColor #FFFFFF
skinparam shadowing false
skinparam defaultFontName Helvetica
skinparam sequenceMessageAlign center
skinparam ParticipantBackgroundColor #EAF3E7
skinparam ParticipantBorderColor #2E5E2A
skinparam ActorBackgroundColor #EAF3E7
skinparam ActorBorderColor #2E5E2A
skinparam sequenceLifeLineBorderColor #9CC49A
skinparam ArrowColor #4B7A46

title CU-87 Controlando la vigencia de los documentos (flujo normal)

actor Sistema
participant "V_Documentos" as V
participant "C_DocumentosLegales" as C
participant ":DocumentoLegal" as D

Sistema -> V : solicita documentos por vencer o vencidos
V -> C : consultarVigencia(dias)
C -> D : obtenerPorVencer(dias)
D - -> C : documentos dentro del umbral
C -> D : obtenerVencidos()
D - -> C : documentos vencidos
C - -> V : listado unificado de vigencia
V - -> Sistema : muestra documentos por vencer y vencidos

@enduml

